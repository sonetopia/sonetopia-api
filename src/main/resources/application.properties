spring.application.name=sonetopia-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.storage.audio-path=${AUDIO_STORAGE_PATH}
spring.storage.signed-url-secret=${SIGNED_URL_SECRET}
spring.storage.user-quota-bytes=${USER_STORAGE_QUOTA_BYTES:1073741824}
spring.storage.temp-audio-ttl-minutes=${TEMP_AUDIO_TTL_MINUTES:60}

# yt-dlp
spring.yt-dlp.path=${YT_DLP_PATH:yt-dlp}
spring.yt-dlp.timeout-seconds=${YT_DLP_TIMEOUT_SECONDS:180}

# Security / JWT
spring.security.jwt.secret=${JWT_SECRET}
spring.security.jwt.expiration=${JWT_EXPIRATION:86400000}
spring.security.email-verification.expiration=${EMAIL_VERIFICATION_EXPIRATION:86400000}

app.google.client-id=${GOOGLE_CLIENT_ID}

# Mail / Brevo SMTP
spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME:}
spring.mail.password=${BREVO_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.email.enabled=${MAIL_ENABLED:true}
app.email.from=${MAIL_FROM:no-reply@sonetopia.luckyabdillah.com}
app.email.from-name=${MAIL_FROM_NAME:Sonetopia}
app.email.logo-url=${MAIL_LOGO_URL:}
app.email.verification-url=${EMAIL_VERIFICATION_URL:http://localhost:8080/api/auth/verify-email}
app.email.verification-resend-cooldown-seconds=${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# Springdoc OpenAPI
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Optional: sort endpoints by HTTP method
springdoc.swagger-ui.operations-sorter=method

# Optional: sort endpoint groups alphabetically
springdoc.swagger-ui.tags-sorter=alpha

# CORS
spring.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
