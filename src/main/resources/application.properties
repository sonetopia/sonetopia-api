spring.application.name=sonetopia-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.storage.audio-path=${AUDIO_STORAGE_PATH}
spring.storage.signed-url-secret=${SIGNED_URL_SECRET}

# Security / JWT
spring.security.jwt.secret=${JWT_SECRET}
spring.security.jwt.expiration=${JWT_EXPIRATION:86400000}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# Springdoc OpenAPI
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Optional: sort endpoints by HTTP method
springdoc.swagger-ui.operations-sorter=method

# Optional: sort endpoint groups alphabetically
springdoc.swagger-ui.tags-sorter=alpha

# CORS
spring.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
