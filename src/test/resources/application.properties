spring.application.name=sonetopia-api

spring.datasource.url=jdbc:postgresql://localhost:5432/sonetopia?currentSchema=sonetopia_test
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=sonetopia_test

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=sonetopia_test
spring.flyway.create-schemas=true

spring.storage.audio-path=target/test-storage
spring.storage.signed-url-secret=sonetopia-very-secret-key-from-microsoft
spring.storage.user-quota-bytes=1073741824
spring.storage.temp-audio-ttl-minutes=${TEMP_AUDIO_TTL_MINUTES:60}

# yt-dlp
spring.yt-dlp.path=/path/to/yt-dlp
spring.yt-dlp.timeout-seconds=180

# Security / JWT
spring.security.jwt.secret=sonetopia-jwt-secret-key-for-testing
spring.security.jwt.expiration=86400000
spring.security.email-verification.expiration=86400000

app.google.client-id=test-google-client-id

app.github.client-id=test-github-client-id
app.github.client-secret=test-github-client-secret
app.github.redirect-uri=http://localhost:5173/auth/github/callback

app.apple.enabled=false
app.apple.client-id=test-apple-client-id

app.email.enabled=false
app.email.from=no-reply@sonetopia.luckyabdillah.com
app.email.from-name=Sonetopia
app.email.logo-url=
app.email.verification-url=http://localhost:8080/api/auth/verify-email
app.email.verification-resend-cooldown-seconds=60
spring.mail.host=localhost
spring.mail.port=2525

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# Springdoc OpenAPI
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Optional: sort endpoints by HTTP method
springdoc.swagger-ui.operations-sorter=method

# Optional: sort endpoint groups alphabetically
springdoc.swagger-ui.tags-sorter=alpha

# CORS
spring.cors.allowed-origins=*
